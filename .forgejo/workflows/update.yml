name: Update

on:
  # manual trigger only
  workflow_dispatch:

jobs:
  version_update:
    runs-on: codeberg-tiny
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name "Update Bot"
          git config user.email "update@noreply.codeberg.org"
          git remote add upstream https://codeberg.org/t0fv404/Tufted_typst_blog.git || true
          git fetch upstream main

          # Read this repository's rules before switching to upstream/main.
          IGNORE_FILE="$(mktemp)"
          sed -e 's/[[:space:]]*#.*//' -e 's/[[:space:]]*$//' \
            .templatesyncignore | grep -v '^$' > "$IGNORE_FILE"

          # Keep target history, then copy only non-ignored upstream files.
          BRANCH="update/upstream-${{ forgejo.run_number }}"
          git switch -c "$BRANCH" origin/main

          is_ignored() {
            while IFS= read -r pattern; do
              case "$pattern" in
                */) [[ "$1" == "$pattern"* ]] && return 0 ;;
                *)  [[ "$1" == "$pattern" ]] && return 0 ;;
              esac
            done < "$IGNORE_FILE"
            return 1
          }

          git ls-tree -r --name-only origin/main | while IFS= read -r path; do
            is_ignored "$path" || git cat-file -e "upstream/main:$path" 2>/dev/null || git rm -f --ignore-unmatch -- "$path"
          done

          git ls-tree -r --name-only upstream/main | while IFS= read -r path; do
            is_ignored "$path" || git checkout upstream/main -- "$path"
          done

          rm "$IGNORE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "update: 保留用户内容与配置"
          else
            echo "无上游更新，跳过。"
            exit 0
          fi

          # 推送分支并用 Codeberg API 开 PR
          git push -f "https://${{ forgejo.actor }}:${{ secrets.FORGEJO_TOKEN }}@codeberg.org/${{ forgejo.repository }}.git" "$BRANCH"
          curl -fsS -X POST \
            "https://codeberg.org/api/v1/repos/${{ forgejo.repository }}/pulls" \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"head":"'"$BRANCH"'","base":"main","title":"同步模板更新","body":"自动创建的同步 PR，请审查后合并。"}'
