name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      # typst 官方只发布 musl 静态二进制 —— 静态链接，glibc/musl 主机都能跑
      - name: Install Typst
        run: |
          mkdir -p ~/bin
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C ~/bin
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build site
        env:
          OWNER: ${{ forgejo.event.repository.owner.username }}
          REPOSITORY: ${{ forgejo.event.repository.name }}
        run: |
          [ "$REPOSITORY" = "pages" ] || SITE_URL+="$REPOSITORY/"
          python3 build.py build -f

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ case(forgejo.event.repository.name == 'pages', format('https://{0}.codeberg.page/', forgejo.event.repository.owner.username), format('https://{0}.codeberg.page/{1}/', forgejo.event.repository.owner.username, forgejo.event.repository.name)) }}
          token: ${{ forgejo.token }}
          source: _site/
